    <div class="container">

                <div class="highlight"><strong>Summary:</strong> LARVIP stores your codes on your iPhone. We do not ask for an account. We do not sell personal information, and we do not disclose it to third parties for their own purposes.</div>
                <h2>1. Introduction</h2>
                <p>This Privacy Policy describes how the LARVIP application for iPhone (“the App”) and the connection service that supports it handle information. By using the App, you agree to the practices described here.</p>
                <h2>2. Information we process</h2>
                <p>The App does not ask you to create an online account, and it does not ask for your name, email address, or phone number.</p>

                    <li><strong>Codes.</strong> Your access code and alternate code are stored in the iOS Keychain on your device. We do not receive those codes.</li>
                    <li><strong>Link.</strong> If you paste a link or scan its QR code, the App uses that link to activate your access with our service. The service records that the link was used.</li>
                    <li><strong>Connection.</strong> While the connection is on, traffic to the destinations included in your access is sent through our service so it can be delivered. Our service can see those destinations and the amount of data transferred, because that is required to provide the connection and apply its data allowance. Traffic that is not part of your access stays on your normal internet connection and is not sent to us.</li>
                    <li><strong>Camera.</strong> If you choose to scan a QR code, the camera is used on the device to read that code. The App does not save the photo.</li>
                    <li><strong>On the device.</strong> The App stores your access and preferences locally so the connection can work.</li>
                </ul>
                <h2>3. How information is used</h2>
                <p>Information is used only to operate the App and the connection: to activate the link you add, to connect and disconnect, to deliver traffic for the destinations in your access, and to account for data use. It is not used for advertising or tracking across other companies’ apps and websites.</p>
                <h2>4. Data sharing</h2>
                <p>We do not sell your personal information. We do not disclose personal information to third parties for their own purposes, including advertising or analytics. We do not use the connection to collect data for any purpose other than providing the service you request.</p>
                <p>Standard Apple system services, such as the VPN permission prompt, the camera, or iOS itself, may process technical data required for the App to function on your device.</p>
                <h2>5. Data retention and deletion</h2>
                <p>Codes and the saved access remain on your device until you remove them in the App or uninstall it. Uninstalling the App removes the App’s local data in the ordinary course of iOS. Connection records kept by the service, such as the fact that a link was activated and how much data was transferred, are kept only as long as needed to operate that access and its allowance.</p>
                <h2>6. Security</h2>
                <p>Codes are stored in the iOS Keychain. We use reasonable measures to help protect information processed by the service. No method of electronic transmission or storage is completely secure, and we cannot guarantee absolute security.</p>

                <h2>10. Contact</h2>
                <p>If you have questions about this Privacy Policy or LARVIP, contact us at <a href="mailto:info@520apps.com">info@520apps.com</a>.</p>`
            },

        function detectLanguage() {
            const saved = localStorage.getItem('larvip-language');
            if (saved && pages[saved]) return saved;
            const browserLang = navigator.language || navigator.userLanguage || 'en';
            if (browserLang.startsWith('zh')) return 'zh';
            if (browserLang.startsWith('es')) return 'es';
            return 'en';
        }

        function changeLanguage(lang, button) {
            const page = pages[lang];
            if (!page) return;
            document.title = page.title;
            document.getElementById('title').textContent = page.heading;
            document.getElementById('updated').textContent = page.updated;
            document.getElementById('policy').innerHTML = page.html;
            document.getElementById('back').textContent = page.back;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if (button) button.classList.add('active');
            localStorage.setItem('larvip-language', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const lang = detectLanguage();
            const buttons = document.querySelectorAll('.lang-btn');
            let active = buttons[0];
            buttons.forEach(btn => {
                const label = btn.textContent.trim();
                if ((lang === 'zh' && label === '中文') || (lang === 'es' && label === 'ES') || (lang === 'en' && label === 'EN')) active = btn;
            });
            changeLanguage(lang, active);
        });
    </script>
